name: E2E

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ambassadorc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Fresh, ephemeral DB — `prisma db push` is SAFE here (no sync_* tables to drop).
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ambassadorc_test
      JWT_SECRET: ci-e2e-secret
      JWT_EXPIRES_IN: 7d
      PORT: "3001"
      NODE_ENV: development
      CI: "true"
      # Allow the data-mutating E2E tests (capture, export, quota) against this throwaway DB.
      E2E_ALLOW_MUTATIONS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (root + backend + frontend)
        run: |
          npm ci
          (cd backend && npm ci)
          (cd frontend && npm ci)

      - name: Generate Prisma client + create schema (fresh DB)
        run: |
          cd backend
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Seed CI data
        run: cd backend && npx tsx scripts/ci-seed.ts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # Scope to the FoxPro lifecycle spec. The smoke.spec.ts tests assert
        # against production data (specific agents/amounts) and are run against
        # the live environment, not this ephemeral seeded DB.
        run: npx playwright test tests/e2e/foxpro.spec.ts

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
